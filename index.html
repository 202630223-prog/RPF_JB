<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>랜덤 플레이푸드</title>
  <style>
    :root {
      --bg-main: #eef1f5;
      --bg-card: #ffffff;
      --bg-sub: #f7f8f9;
      --text-main: #191f28;
      --text-sub: #8b95a1;
      --primary: #0064FF;
      --primary-hover: #0052cc;
      --primary-bg: #e8f3ff;
      --border-color: #e5e8eb;
      --card-shadow: 0 16px 36px rgba(0, 0, 0, 0.08);
      --radius-lg: 20px;
      --radius-md: 12px;
      --font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
    }

    [data-theme="dark"] {
      --bg-main: #0a0a0a;
      --bg-card: #141414;
      --bg-sub: #222222;
      --text-main: #ffffff;
      --text-sub: #a3a3a3;
      --primary: #E50914;
      --primary-hover: #b81d24;
      --primary-bg: rgba(229, 9, 20, 0.2);
      --border-color: #333333;
      --card-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-family);
      transition: background-color 0.25s, color 0.25s, border-color 0.25s;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      width: 100vw;
      overflow-x: hidden;
      padding: 0;
    }

    /* 16:9 꽉 찬 앱 컨테이너 */
    .app-container {
      width: 100vw;
      height: 100vh;
      max-width: 100%;
      background-color: var(--bg-card);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    header {
      padding: 0 28px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 64px;
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }

    .btn-header {
      background-color: var(--bg-sub);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* 상단 슬림 진행도 (작게 배치) */
    .mini-progress-bar {
      width: 100%;
      height: 4px;
      background-color: var(--border-color);
      position: relative;
    }

    .mini-progress-fill {
      height: 100%;
      width: 0%;
      background-color: var(--primary);
      transition: width 0.3s ease;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      position: relative;
    }

    .screen {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .screen.hidden {
      display: none !important;
    }

    /* 1. 시작 화면 */
    #screen-start {
      text-align: center;
      gap: 32px;
    }

    .hero-box .subtitle {
      font-size: 1.1rem;
      color: var(--text-sub);
      font-weight: 600;
      margin-bottom: 8px;
    }

    .hero-box h2 {
      font-size: 2.5rem;
      line-height: 1.3;
      font-weight: 800;
    }

    .mode-selection-box {
      display: flex;
      gap: 16px;
      width: 100%;
      max-width: 500px;
    }

    /* 2. 옵션 버튼 그리드 */
    .step-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .step-header h3 {
      font-size: 1.5rem;
      font-weight: 800;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      width: 100%;
      margin-bottom: 24px;
    }

    .btn-option {
      padding: 24px 16px;
      background-color: var(--bg-sub);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }

    .btn-option:hover {
      border-color: var(--primary);
      color: var(--primary);
      background-color: var(--primary-bg);
    }

    /* 3. 빠른 선택 탭 */
    .tabs-header {
      display: flex;
      gap: 8px;
      background-color: var(--bg-sub);
      padding: 6px;
      border-radius: var(--radius-md);
      width: 100%;
      margin-bottom: 24px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px 0;
      background: transparent;
      border: none;
      color: var(--text-sub);
      font-size: 1rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
    }

    .tab-btn.active {
      background-color: var(--bg-card);
      color: var(--text-main);
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    /* 4. 결과 화면 */
    .result-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      width: 100%;
      max-height: 320px;
      overflow-y: auto;
      margin-bottom: 24px;
    }

    .result-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      background-color: var(--bg-sub);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      font-size: 1rem;
      font-weight: 700;
    }

    .result-item-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .result-item-sub {
      font-size: 0.8rem;
      color: var(--text-sub);
      font-weight: 400;
    }

    .btn-exclude {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 4px 8px;
    }

    .btn-exclude:hover {
      color: #e50914;
    }

    /* 공통 버튼 */
    .btn-primary {
      flex: 1;
      padding: 18px;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-md);
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-secondary {
      flex: 1;
      padding: 18px;
      background-color: var(--bg-sub);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-action {
      width: 100%;
      padding: 16px;
      background-color: var(--primary-bg);
      color: var(--primary);
      border: 1px solid var(--primary);
      border-radius: var(--radius-md);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    .result-actions {
      display: flex;
      gap: 12px;
      width: 100%;
    }

    /* 모달 */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(6px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 100;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background-color: var(--bg-card);
      padding: 32px 28px;
      border-radius: var(--radius-lg);
      text-align: center;
      width: 340px;
      border: 1px solid var(--border-color);
      box-shadow: var(--card-shadow);
    }

    .modal-title {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--primary);
      margin-top: 8px;
    }

    /* CRUD 관리 모달 */
    .crud-modal-content {
      width: 500px;
      max-height: 80vh;
      overflow-y: auto;
      text-align: left;
    }

    .crud-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .crud-input, .crud-select {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-sub);
      color: var(--text-main);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <div class="header-left">
        <h1>랜덤 플레이푸드</h1>
      </div>
      <div class="header-actions">
        <button id="btn-manage-menu" class="btn-header">메뉴 관리 / DB</button>
        <button id="theme-toggle-btn" class="btn-header">Dark Mode</button>
      </div>
    </header>

    <!-- 상단 작고 슬림한 진행도 표시줄 -->
    <div class="mini-progress-bar">
      <div id="progress-fill" class="mini-progress-fill"></div>
    </div>

    <main>
      <!-- 1. 시작 화면 -->
      <div id="screen-start" class="screen">
        <div class="hero-box">
          <p class="subtitle">결정 장애를 위한 맞춤 음식 추천</p>
          <h2>오늘 어떤 요리를<br>플레이해볼까요?</h2>
        </div>
        <div class="mode-selection-box">
          <button id="btn-mode-step" class="btn-primary">단계별로 찾기</button>
          <button id="btn-mode-quick" class="btn-secondary">빠른 조합 찾기</button>
        </div>
      </div>

      <!-- 2. 단계별 선택 화면 -->
      <div id="screen-step" class="screen hidden">
        <div class="step-header">
          <h3 id="step-title-text">원하는 맛을 선택하세요</h3>
        </div>
        <div id="step-options-grid" class="options-grid"></div>
        <button id="btn-spin-step" class="btn-action">랜덤 뽑기 🎲</button>
      </div>

      <!-- 3. 빠른 선택 화면 -->
      <div id="screen-quick" class="screen hidden">
        <div class="tabs-header">
          <button class="tab-btn active" data-tab="taste">맛</button>
          <button class="tab-btn" data-tab="main">주메뉴</button>
          <button class="tab-btn" data-tab="origin">출처</button>
        </div>
        <div id="quick-options-grid" class="options-grid"></div>
        <button id="btn-spin-quick" class="btn-primary">이 조건으로 바로 추천받기</button>
      </div>

      <!-- 4. 결과 화면 -->
      <div id="screen-result" class="screen hidden">
        <div class="step-header">
          <h3>오늘의 추천 결과</h3>
          <p style="color: var(--text-sub); font-size: 0.9rem; margin-top: 4px;">'X'를 누르면 오늘 추천에서 해당 메뉴가 제외됩니다.</p>
        </div>
        <div id="result-list-box" class="result-list"></div>
        <div class="result-actions">
          <button id="btn-spin-final" class="btn-primary">최종 1개 잭팟 뽑기 🎰</button>
          <button id="btn-reset" class="btn-secondary">처음부터 다시</button>
        </div>
      </div>
    </main>

    <!-- 롤링 / 팝업 모달 -->
    <div id="app-modal" class="modal-overlay">
      <div class="modal-content">
        <p id="modal-subtitle" style="font-size: 0.85rem; color: var(--text-sub);">선택 중...</p>
        <h2 id="modal-title" class="modal-title">메뉴명</h2>
      </div>
    </div>

    <!-- 메뉴 관리 CRUD 모달 -->
    <div id="crud-modal" class="modal-overlay">
      <div class="modal-content crud-modal-content">
        <h3 style="margin-bottom: 16px;">메뉴 DB 관리</h3>
        <div class="crud-form">
          <input type="text" id="add-name" class="crud-input" placeholder="음식 이름">
          <select id="add-taste" class="crud-select">
            <option value="매운맛">매운맛</option>
            <option value="단맛">단맛</option>
            <option value="짠맛">짠맛</option>
            <option value="고소한맛">고소한맛</option>
            <option value="담백한맛">담백한맛</option>
            <option value="새콤한맛">새콤한맛</option>
          </select>
          <select id="add-main" class="crud-select">
            <option value="밥">밥</option>
            <option value="면">면</option>
            <option value="빵/패스트푸드">빵/패스트푸드</option>
            <option value="고기/구이">고기/구이</option>
            <option value="국물/탕">국물/탕</option>
            <option value="해산물/회">해산물/회</option>
          </select>
          <select id="add-origin" class="crud-select">
            <option value="한식">한식</option>
            <option value="중식">중식</option>
            <option value="일식">일식</option>
            <option value="양식">양식</option>
            <option value="동남아식">동남아식</option>
            <option value="분식/야식">분식/야식</option>
          </select>
          <button id="btn-add-item" class="btn-primary" style="padding: 10px;">새 메뉴 추가</button>
        </div>
        <button id="btn-close-crud" class="btn-secondary" style="width: 100%; padding: 10px;">닫기</button>
      </div>
    </div>
  </div>

  <script>
    // Audio Context
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playTick() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(300, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.03);
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.03);
    }

    function playChime() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      [523.25, 659.25, 783.99].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now + i * 0.06);
        gain.gain.setValueAtTime(0.08, now + i * 0.06);
        gain.gain.linearRampToValueAtTime(0.001, now + i * 0.06 + 0.2);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + i * 0.06);
        osc.stop(now + i * 0.06 + 0.2);
      });
    }

      { name: "김치 수제비", taste: "새콤한맛", main: "국물/탕", origin: "한식" },
      { name: "묵은지 김치찜", taste: "새콤한맛", main: "고기/구이", origin: "한식" },
      { name: "오이 냉국", taste: "새콤한맛", main: "국물/탕", origin: "한식" },
      { name: "미역 오이 초무침", taste: "새콤한맛", main: "해산물/회", origin: "한식" }
    ];

    let foodDB = JSON.parse(localStorage.getItem('rpf_foodDB')) || initialFoodDB;
    let excludedList = JSON.parse(localStorage.getItem('rpf_excluded')) || [];

    let currentStepIndex = 0;
    let userSelection = { taste: '', main: '', origin: '' };
    let activeQuickTab = 'taste';

    const stepKeys = ['taste', 'main', 'origin'];
    const stepTitles = ['원하는 맛을 선택하세요', '주메뉴 종류를 선택하세요', '음식 출처를 선택하세요'];

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('theme-toggle-btn').addEventListener('click', toggleTheme);
      document.getElementById('btn-manage-menu').addEventListener('click', () => document.getElementById('crud-modal').classList.add('active'));
      document.getElementById('btn-close-crud').addEventListener('click', () => document.getElementById('crud-modal').classList.remove('active'));
      
      document.getElementById('btn-mode-step').addEventListener('click', () => initMode('step'));
      document.getElementById('btn-mode-quick').addEventListener('click', () => initMode('quick'));
      document.getElementById('btn-spin-step').addEventListener('click', spinCurrentStep);
      document.getElementById('btn-spin-quick').addEventListener('click', runDirectFinalSpin);
      document.getElementById('btn-spin-final').addEventListener('click', runFinalJackpot);
      document.getElementById('btn-reset').addEventListener('click', resetAll);
      document.getElementById('btn-add-item').addEventListener('click', addNewFoodItem);

      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          switchQuickTab(e.target.getAttribute('data-tab'), e.target);
        });
      });
    });

    function setProgress(percent) {
      document.getElementById('progress-fill').style.width = percent + '%';
    }

    function initMode(mode) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      userSelection = { taste: '', main: '', origin: '' };
      hideAllScreens();

      if (mode === 'step') {
        currentStepIndex = 0;
        setProgress(33);
        document.getElementById('screen-step').classList.remove('hidden');
        renderStepContent();
      } else {
        setProgress(50);
        document.getElementById('screen-quick').classList.remove('hidden');
        renderQuickContent();
      }
    }

    function hideAllScreens() {
      document.getElementById('screen-start').classList.add('hidden');
      document.getElementById('screen-step').classList.add('hidden');
      document.getElementById('screen-quick').classList.add('hidden');
      document.getElementById('screen-result').classList.add('hidden');
    }

    function renderStepContent() {
      const key = stepKeys[currentStepIndex];
      document.getElementById('step-title-text').innerText = stepTitles[currentStepIndex];
      setProgress(((currentStepIndex + 1) / 3) * 100);

      const grid = document.getElementById('step-options-grid');
      grid.innerHTML = '';
      optionsData[key].forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'btn-option';
        btn.innerText = opt;
        btn.onclick = () => onUserManualSelect(key, opt);
        grid.appendChild(btn);
      });
    }

    function onUserManualSelect(category, val) {
      userSelection[category] = val;
      showPraiseModal("선택 완료", val, () => advanceStep());
    }

    function advanceStep() {
      if (currentStepIndex < 2) {
        currentStepIndex++;
        renderStepContent();
      } else {
        showFinalResultScreen();
      }
    }

    function spinCurrentStep() {
      const key = stepKeys[currentStepIndex];
      runSpinAnimation(optionsData[key], (selected) => {
        userSelection[key] = selected;
        advanceStep();
      });
    }

    function switchQuickTab(tabKey, targetBtn) {
      activeQuickTab = tabKey;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      targetBtn.classList.add('active');
      renderQuickContent();
    }

    function renderQuickContent() {
      const grid = document.getElementById('quick-options-grid');
      grid.innerHTML = '';
      optionsData[activeQuickTab].forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'btn-option';
        if (userSelection[activeQuickTab] === opt) btn.style.borderColor = 'var(--primary)';
        btn.innerText = opt;
        btn.onclick = () => {
          userSelection[activeQuickTab] = opt;
          renderQuickContent();
        };
        grid.appendChild(btn);
      });
    }

    function runDirectFinalSpin() {
      if (!userSelection[activeQuickTab]) {
        userSelection[activeQuickTab] = optionsData[activeQuickTab][0];
      }
      showFinalResultScreen();
    }

    function showFinalResultScreen() {
      hideAllScreens();
      setProgress(100);
      document.getElementById('screen-result').classList.remove('hidden');
      renderResults();
    }

    function renderResults() {
      const container = document.getElementById('result-list-box');
      container.innerHTML = '';

      const exactMatches = foodDB.filter(f => {
        if (excludedList.includes(f.name)) return false;
        if (userSelection.taste && f.taste !== userSelection.taste) return false;
        if (userSelection.main && f.main !== userSelection.main) return false;
        if (userSelection.origin && f.origin !== userSelection.origin) return false;
        return true;
      });

      if (exactMatches.length === 0) {
        container.innerHTML = `<div style="grid-column: 1 / -1; padding: 24px; text-align: center; color: var(--text-sub);">조건에 맞는 메뉴가 없거나 모두 제외되었습니다.</div>`;
        return;
      }

      exactMatches.forEach(item => {
        const div = document.createElement('div');
        div.className = 'result-item';
        div.innerHTML = `
          <div class="result-item-info">
            <span>${item.name}</span>
            <span class="result-item-sub">${item.origin} · ${item.main}</span>
          </div>
          <button class="btn-exclude" onclick="excludeMenu('${item.name}')">✕</button>
        `;
        container.appendChild(div);
      });
    }

    function excludeMenu(name) {
      excludedList.push(name);
      localStorage.setItem('rpf_excluded', JSON.stringify(excludedList));
      renderResults();
    }

    function runFinalJackpot() {
      const items = document.querySelectorAll('.result-item-info span:first-child');
      const list = Array.from(items).map(i => i.innerText);
      if (list.length === 0) return;

      runSpinAnimation(list, (winner) => {
        showPraiseModal("오늘의 추천 요리", winner, null, 2500);
      });
    }

    function addNewFoodItem() {
      const name = document.getElementById('add-name').value.trim();
      if (!name) return alert('음식 이름을 입력해주세요!');

      const newItem = {
        name: name,
        taste: document.getElementById('add-taste').value,
        main: document.getElementById('add-main').value,
        origin: document.getElementById('add-origin').value
      };

      foodDB.push(newItem);
      localStorage.setItem('rpf_foodDB', JSON.stringify(foodDB));
      alert(`${name} 메뉴가 추가되었습니다!`);
      document.getElementById('add-name').value = '';
      document.getElementById('crud-modal').classList.remove('active');
    }

    function showPraiseModal(subtitle, title, callback, delay = 1000) {
      const modal = document.getElementById('app-modal');
      document.getElementById('modal-subtitle').innerText = subtitle;
      document.getElementById('modal-title').innerText = title;
      
      modal.classList.add('active');
      playChime();

      setTimeout(() => {
        modal.classList.remove('active');
        if (callback) callback();
      }, delay);
    }

    function runSpinAnimation(optionsArray, onComplete) {
      const modal = document.getElementById('app-modal');
      const sub = document.getElementById('modal-subtitle');
      const main = document.getElementById('modal-title');

      sub.innerText = "선택 중...";
      modal.classList.add('active');

      let idx = 0;
      const interval = setInterval(() => {
        main.innerText = optionsArray[idx % optionsArray.length];
        playTick();
        idx++;
      }, 50);

      setTimeout(() => {
        clearInterval(interval);
        const finalSelected = optionsArray[Math.floor(Math.random() * optionsArray.length)];
        sub.innerText = "선택 완료";
        main.innerText = finalSelected;
        playChime();

        setTimeout(() => {
          modal.classList.remove('active');
          onComplete(finalSelected);
        }, 900);
      }, 1200);
    }

    function resetAll() {
      userSelection = { taste: '', main: '', origin: '' };
      currentStepIndex = 0;
      setProgress(0);
      hideAllScreens();
      document.getElementById('screen-start').classList.remove('hidden');
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      document.getElementById('theme-toggle-btn').innerText = next === 'dark' ? 'Light Mode' : 'Dark Mode';
    }
  </script>
