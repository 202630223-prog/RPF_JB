<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Play Food</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <!-- 헤더 -->
    <header>
      <div class="brand">Random Play Food</div>
      <div class="header-actions">
        <div class="steps-indicator hidden" id="steps-indicator">
          <div class="step-pill active" id="pill-1"></div>
          <div class="step-pill" id="pill-2"></div>
          <div class="step-pill" id="pill-3"></div>
        </div>
        <button class="theme-toggle" id="theme-toggle-btn">Dark Mode</button>
      </div>
    </header>

    <!-- 1. 시작 화면 -->
    <div class="view-screen" id="screen-start">
      <h1 class="start-title">오늘 뭐 먹지?</h1>
      <p class="start-desc">고민 없이 쉽고 빠르게 메뉴를 결정해보세요.</p>
      <div class="mode-select-group">
        <button class="btn-main btn-primary" id="btn-mode-step">단계별 맞춤 선택</button>
        <button class="btn-main btn-secondary" id="btn-mode-quick">빠른 단일 선택</button>
      </div>
    </div>

    <!-- 2. 단계별 진행 화면 (STEP 1 ~ 3) -->
    <div class="content-body hidden" id="screen-step">
      <h2 class="step-title" id="step-title-text">원하는 맛을 선택하세요</h2>
      <p class="step-sub" id="step-sub-text">원하는 옵션을 클릭하거나 무작위 스핀을 실행하세요.</p>
      
      <div class="grid-6" id="step-options-grid"></div>

      <div class="bottom-actions">
        <button class="btn-spin" id="btn-spin-step">현재 단계 랜덤 스핀</button>
      </div>
    </div>

    <!-- 3. 빠른 단일 선택 화면 -->
    <div class="content-body hidden" id="screen-quick">
      <h2 class="step-title">끌리는 조건 하나만 선택하세요</h2>
      <p class="step-sub">카테고리를 선택한 후 옵션을 지정하고 바로 스핀을 돌릴 수 있습니다.</p>

      <div class="category-tabs">
        <button class="tab-btn active" data-tab="taste">맛</button>
        <button class="tab-btn" data-tab="main">종류</button>
        <button class="tab-btn" data-tab="origin">음식 출처</button>
      </div>

      <div class="grid-6" id="quick-options-grid"></div>

      <div class="bottom-actions">
        <button class="btn-spin" id="btn-spin-quick">선택 조건으로 바로 스핀</button>
      </div>
    </div>

    <!-- 4. 최종 결과 화면 -->
    <div class="content-body hidden" id="screen-result">
      <h2 class="step-title">추천 음식 라인업</h2>
      <p class="step-sub">조건에 기반한 최종 후보입니다. 마지막 스핀으로 최종 1개를 결정하세요.</p>
      
      <div class="result-list" id="result-list-box"></div>

      <div class="bottom-actions">
        <button class="btn-spin" id="btn-spin-final">최종 1개 결정하기 (SPIN)</button>
        <button class="btn-main btn-secondary" style="border-radius:14px;" id="btn-reset">다시하기</button>
      </div>
    </div>

    <!-- 모달/팝업 연출 -->
    <div class="modal-overlay" id="app-modal">
      <div class="modal-box">
        <div class="praise-text" id="modal-subtitle"></div>
        <div class="spin-result-text" id="modal-title">...</div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
